<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI/WIRE</title>
<meta name="description" content="Daily frontier AI model index and news brief.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #101014;
    --paper: #FFFFFF;
    --ghost: #F2F3F1;
    --line: #E3E4E0;
    --klein: #2427D6;
    --klein-soft: #E9EAFB;
    --dim: #6B6C70;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Archivo', sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }
  header {
    border-bottom: 3px solid var(--ink);
    padding: 28px 24px 18px;
  }
  .shell {
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
  }
  header .shell {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }
  .masthead h1 {
    font-weight: 900;
    font-stretch: 115%;
    font-size: clamp(34px, 6vw, 54px);
    letter-spacing: -0.02em;
    line-height: 0.95;
  }
  .masthead h1 .k { color: var(--klein); }
  .masthead .strap {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
    margin-top: 8px;
  }
  .masthead .strap a { color: inherit; text-decoration: underline; }
  .head-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }
  .datestamp {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .updated {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--dim);
  }
  #refreshBtn {
    display: none;
    margin-top: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: var(--klein);
    color: #fff;
    border: none;
    padding: 10px 18px;
    cursor: pointer;
  }
  #refreshBtn:hover { background: var(--ink); }
  #refreshBtn:disabled { background: var(--dim); cursor: wait; }
  #refreshBtn:focus-visible, .tab:focus-visible { outline: 3px solid var(--klein); outline-offset: 2px; }
  nav { border-bottom: 1px solid var(--line); }
  nav .shell { display: flex; }
  .tab {
    flex: 1;
    background: none;
    border: none;
    border-right: 1px solid var(--line);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 18px 8px;
    cursor: pointer;
    color: var(--dim);
  }
  .tab:last-child { border-right: none; }
  .tab.active { color: var(--ink); box-shadow: inset 0 -3px 0 var(--klein); font-weight: 600; }
  main { padding: 0 0 60px; }
  section { display: none; }
  section.active { display: block; }
  .status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--dim);
    padding: 24px;
  }
  .status:empty { display: none; }
  .status.err { color: #B3261E; }
  .section-head {
    padding: 28px 24px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  #modelsList > .model.frontier:first-child {
    padding-top: 28px;
  }
  .section-head.all {
    font-size: 11px;
    color: var(--dim);
    padding-top: 22px;
  }
  .models-divider {
    border: none;
    border-top: 1px solid var(--ink);
    margin: 8px 24px 0;
  }
  .model {
    border-bottom: 1px solid var(--line);
    padding: 18px 24px;
    display: grid;
    grid-template-columns: 150px 1fr 180px;
    gap: 18px;
    align-items: start;
  }
  .model.frontier {
    grid-template-columns: 1fr 180px;
  }
  .model .rank {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 20px;
    color: var(--ink);
    line-height: 1;
    margin-bottom: 6px;
  }
  .model .co {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .model.frontier .frontier-main {
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: 10px;
    row-gap: 6px;
    align-items: baseline;
  }
  .model.frontier .frontier-main .rank {
    grid-column: 1;
    grid-row: 1;
    margin-bottom: 0;
  }
  .model.frontier .co-name {
    grid-column: 2;
    grid-row: 1;
    font-family: 'Archivo', sans-serif;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: -0.01em;
    text-transform: none;
    color: var(--ink);
    line-height: 1.15;
  }
  .model.frontier .model-sub {
    grid-column: 2;
    grid-row: 2;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--dim);
    letter-spacing: 0;
    text-transform: none;
  }
  .model.frontier .model-sub .model-hl {
    background: #FFF176;
    padding: 1px 5px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .model.frontier .model-sub a {
    color: inherit;
    text-decoration: none;
  }
  .model.frontier .model-sub a:hover { text-decoration: underline; }
  .model .name { font-weight: 800; font-size: 18px; letter-spacing: -0.01em; }
  .model .name a {
    color: inherit;
    text-decoration: none;
  }
  .model .name a:hover { text-decoration: underline; }
  .model .name .ver { font-weight: 400; color: var(--dim); font-size: 14px; margin-left: 6px; }
  .model .cap { margin-top: 3px; }
  .model .new { margin-top: 6px; font-size: 13px; color: var(--dim); }
  .specs { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .spec {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    background: var(--ghost);
    padding: 3px 8px;
    white-space: nowrap;
  }
  .idxwrap { text-align: right; }
  .idxnum { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 22px; }
  .idxmax {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--dim);
    font-weight: 400;
  }
  .idxlabel {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .idxbar { margin-top: 8px; height: 6px; background: var(--klein-soft); position: relative; }
  .idxbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--klein); display: block; }
  .model.compact {
    grid-template-columns: 48px 1fr auto;
    gap: 12px;
    padding: 8px 24px;
    align-items: center;
  }
  .model.compact .rank {
    font-size: 13px;
    margin-bottom: 0;
  }
  .model.compact .co {
    font-size: 10px;
    letter-spacing: 0.1em;
  }
  .model.compact .name {
    font-size: 14px;
    font-weight: 700;
  }
  .model.compact .idxnum {
    font-size: 14px;
  }
  .story { border-bottom: 1px solid var(--line); padding: 20px 24px; }
  .story .src {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--klein);
  }
  .story h3 { font-weight: 800; font-size: 19px; letter-spacing: -0.01em; margin: 4px 0 6px; }
  .story h3 a {
    color: inherit;
    font: inherit;
    text-decoration: none;
  }
  .story h3 a:hover { text-decoration: underline; }
  .story p { max-width: 640px; }
  .story .why { margin-top: 8px; font-size: 13px; color: var(--dim); max-width: 640px; }
  .story .why b {
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .advice { padding: 48px 24px; max-width: 760px; }
  .advice .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--klein);
    margin-bottom: 14px;
  }
  .advice blockquote {
    font-weight: 700;
    font-size: clamp(20px, 3.4vw, 28px);
    letter-spacing: -0.01em;
    line-height: 1.25;
    border-left: 4px solid var(--klein);
    padding-left: 20px;
  }
  .advice .detail { margin-top: 18px; color: var(--dim); font-size: 15px; }
  footer {
    border-top: 1px solid var(--line);
    padding: 16px 24px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--dim);
  }
  @media (max-width: 720px) {
    .model { grid-template-columns: 1fr; gap: 8px; }
    .model.frontier { grid-template-columns: 1fr; }
    .model.compact { grid-template-columns: 36px 1fr auto; gap: 8px; }
    .idxwrap { text-align: left; }
    .model.compact .idxwrap { text-align: right; }
    header { padding: 20px 16px 14px; }
    .head-right { align-items: flex-start; }
    .model, .story, .section-head { padding-left: 16px; padding-right: 16px; }
    .models-divider { margin-left: 16px; margin-right: 16px; }
    .advice { padding: 32px 16px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .idxbar i { transition: width 600ms ease; }
  }
</style>
</head>
<body>

<header>
  <div class="shell">
  <div class="masthead">
    <h1>AI<span class="k">/</span>WIRE</h1>
    <div class="strap">Frontier model index · Daily brief · Updated every morning · Built by <a href="https://michellemccormack.com" target="_blank" rel="noopener">Michelle</a></div>
  </div>
  <div class="head-right">
    <div class="datestamp" id="dateStamp"></div>
    <div class="updated" id="updatedStamp">Loading…</div>
    <button id="refreshBtn">Refresh brief</button>
  </div>
  </div>
</header>

<nav>
  <div class="shell">
  <button class="tab active" data-tab="models">Today's Top Models</button>
  <button class="tab" data-tab="news">Top 5 News</button>
  <button class="tab" data-tab="advice">Today's Assignment</button>
  </div>
</nav>

<main>
  <div class="shell">
  <section id="models" class="active">
    <div class="status" id="modelsStatus">Loading the model index…</div>
    <div id="modelsList"></div>
  </section>
  <section id="news">
    <div class="status" id="newsStatus"></div>
    <div id="newsList"></div>
  </section>
  <section id="advice">
    <div class="status" id="adviceStatus"></div>
    <div id="adviceBox"></div>
  </section>
  </div>
</main>

<footer>
  <div class="shell">
  Intelligence Index: Artificial Analysis composite where available, otherwise an estimate from current benchmarks. Each update replaces the previous snapshot in full.
  </div>
</footer>

<script>
const $ = id => document.getElementById(id);

if (new URLSearchParams(window.location.search).get('admin') === 'aiwire-editor') {
  $('refreshBtn').style.display = 'inline-block';
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('section').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    $(t.dataset.tab).classList.add('active');
  });
});

$('dateStamp').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function stripParentheticals(name) {
  return String(name ?? '')
    .replace(/\s*\([^)]*\)/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function modelNameHtml(m, { highlight = false } = {}) {
  const label = esc(stripParentheticals(m.model));
  const inner = highlight ? `<span class="model-hl">${label}</span>` : label;
  return m.url
    ? `<a href="${esc(m.url)}" target="_blank" rel="noopener">${inner}</a>`
    : inner;
}

function normalizeModels(models) {
  if (!models) return { frontier: [], all: [] };
  if (Array.isArray(models)) return { frontier: models, all: models };
  return {
    frontier: Array.isArray(models.frontier) ? models.frontier : [],
    all: Array.isArray(models.all) ? models.all : [],
  };
}

function renderFrontierCard(m, rank) {
  const idx = Math.max(0, Math.min(100, Number(m.idx) || 0));
  return `<div class="model frontier">
    <div class="frontier-main">
      <div class="rank">${rank}</div>
      <div class="co-name">${esc(m.co)}</div>
      <div class="model-sub">${modelNameHtml(m, { highlight: rank === 1 })}</div>
    </div>
    <div class="idxwrap">
      <div class="idxnum">${idx || '·'}${idx ? '<span class="idxmax">/100</span>' : ''}</div>
      <div class="idxlabel">Intelligence index</div>
      <div class="idxbar"><i style="width:${idx}%"></i></div>
    </div>
  </div>`;
}

function renderCompactRow(m, rank) {
  const idx = Math.max(0, Math.min(100, Number(m.idx) || 0));
  return `<div class="model compact">
    <div class="rank">${rank}</div>
    <div>
      <div class="co">${esc(m.co)}</div>
      <div class="name">${modelNameHtml(m)}</div>
    </div>
    <div class="idxwrap">
      <div class="idxnum">${idx || '·'}${idx ? '<span class="idxmax">/100</span>' : ''}</div>
    </div>
  </div>`;
}

function renderModels(models) {
  $('modelsStatus').textContent = '';
  const { frontier, all } = normalizeModels(models);
  const frontierSorted = frontier
    .slice()
    .sort((a, b) => (Number(b.idx) || 0) - (Number(a.idx) || 0))
    .slice(0, 7);
  const allSorted = all
    .slice()
    .sort((a, b) => (Number(b.idx) || 0) - (Number(a.idx) || 0));

  const frontierHtml = frontierSorted.map((m, i) => renderFrontierCard(m, i + 1)).join('');
  const allHtml = allSorted.map((m, i) => renderCompactRow(m, i + 1)).join('');

  $('modelsList').innerHTML = `
    ${frontierHtml || '<div class="status">No frontier models yet.</div>'}
    <hr class="models-divider" />
    <div class="section-head all">All Models</div>
    ${allHtml || '<div class="status">No models yet.</div>'}
  `;
}

function renderNews(payload) {
  $('newsStatus').textContent = '';
  $('newsList').innerHTML = (payload.stories || []).map(s => {
    const head = s.url
      ? `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.head)}</a>`
      : esc(s.head);
    return `<div class="story">
      <div class="src">${esc(s.src)}</div>
      <h3>${head}</h3>
      <p>${esc(s.sum)}</p>
      <div class="why"><b>Why it matters</b> · ${esc(s.why)}</div>
    </div>`;
  }).join('');
  const a = payload.advice || {};
  $('adviceStatus').textContent = '';
  $('adviceBox').innerHTML =
    `<div class="advice">
      <div class="eyebrow">Today's Assignment</div>
      <blockquote>${esc(a.move)}</blockquote>
      <div class="detail">${esc(a.detail)}</div>
    </div>`;
}

async function loadSnapshot() {
  try {
    const res = await fetch('/api/brief', { cache: 'no-store' });
    if (!res.ok) {
      $('modelsStatus').textContent = 'No brief published yet. First refresh pending.';
      $('updatedStamp').textContent = 'Not yet updated';
      return null;
    }
    const snap = await res.json();
    if (snap.models) renderModels(snap.models);
    if (snap.news) renderNews(snap.news);
    $('updatedStamp').textContent = 'Last updated ' + new Date(snap.ts).toLocaleString();
    return snap;
  } catch (e) {
    $('modelsStatus').textContent = 'Could not load the brief. Try again shortly.';
    $('modelsStatus').classList.add('err');
    return null;
  }
}

async function manualRefresh() {
  const key = prompt('Editor passphrase:');
  if (!key) return;
  const btn = $('refreshBtn');
  btn.disabled = true;
  btn.textContent = 'Refreshing…';
  $('modelsStatus').classList.remove('err');
  $('modelsStatus').textContent = 'Rebuild started. Checking back in about 90 seconds…';

  // Capture current snapshot ts BEFORE invoking refresh. (Do not optional-chain
  // .json() off the fetch Promise — that never reads the response body.)
  let startingTs = 0;
  try {
    const briefRes = await fetch('/api/brief', { cache: 'no-store' });
    if (briefRes.ok) {
      const startingSnap = await briefRes.json();
      startingTs = startingSnap?.ts || 0;
    }
  } catch (_) {}

  try {
    // Sync gate validates passphrase and returns real 401s; it then kicks the background worker.
    const res = await fetch('/api/refresh', {
      method: 'POST',
      headers: { 'x-refresh-key': key }
    });
    if (res.status === 401) throw new Error('Wrong passphrase');
    if (res.status !== 202 && !res.ok) {
      let detail = 'Refresh failed to start';
      try {
        const body = await res.json();
        if (body?.error) detail = body.error;
      } catch (_) {}
      throw new Error(detail);
    }
  } catch (e) {
    $('modelsStatus').textContent = e.message;
    $('modelsStatus').classList.add('err');
    btn.disabled = false;
    btn.textContent = 'Refresh brief';
    return;
  }
  const startedAt = Date.now();
  const poll = async () => {
    try {
      const r = await fetch('/api/brief', { cache: 'no-store' });
      if (r.ok) {
        const snap = await r.json();
        if (snap.ts && snap.ts > startingTs) {
          if (snap.models) renderModels(snap.models);
          if (snap.news) renderNews(snap.news);
          $('updatedStamp').textContent = 'Last updated ' + new Date(snap.ts).toLocaleString();
          $('modelsStatus').textContent = '';
          btn.disabled = false;
          btn.textContent = 'Refresh brief';
          return;
        }
      }
    } catch (e) {}
    if (Date.now() - startedAt < 5 * 60 * 1000) {
      setTimeout(poll, 10000);
    } else {
      $('modelsStatus').textContent = 'Refresh did not publish a new brief. Check passphrase, function logs, and env vars (AA_API_KEY, NEWSAPI_KEY, ANTHROPIC_API_KEY).';
      $('modelsStatus').classList.add('err');
      btn.disabled = false;
      btn.textContent = 'Refresh brief';
    }
  };
  setTimeout(poll, 15000);
}

$('refreshBtn').addEventListener('click', manualRefresh);
loadSnapshot();
</script>
</body>
</html>
